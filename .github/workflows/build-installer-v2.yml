name: Build JustVoxel installer v2 offline ISO

on:
  push:
    branches:
      - testing-v2
    paths:
      - ".github/workflows/build-installer-v2.yml"
      - "installer-v2/**"

permissions:
  contents: read
  packages: read

env:
  INSTALLER_IMAGE: localhost/justvoxel-installer-v2:testing
  PAYLOAD_IMAGE: ghcr.io/home-server-project/justvoxel-hws:testing
  IMAGE_BUILDER_IMAGE: ghcr.io/osbuild/image-builder:latest
  ISO_BASENAME: JustVoxel-HWS-testing-x86_64

jobs:
  build-installer:
    name: Build HWS testing offline ISO
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Authenticate rootful Podman to GHCR
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | sudo podman login ghcr.io \
            --username "${GHCR_ACTOR}" \
            --password-stdin

      - name: Pull JustVoxel HWS testing payload
        run: |
          set -euo pipefail
          sudo podman pull "${PAYLOAD_IMAGE}"

      - name: Build local installer environment
        run: |
          set -euo pipefail
          sudo podman build \
            --pull=always \
            --file installer-v2/Containerfile \
            --tag "${INSTALLER_IMAGE}" \
            .

      - name: Pull image-builder
        run: |
          set -euo pipefail
          sudo podman pull "${IMAGE_BUILDER_IMAGE}"

      - name: Prepare clean output directory
        run: |
          set -euo pipefail
          sudo rm -rf "${GITHUB_WORKSPACE}/output"
          mkdir -p "${GITHUB_WORKSPACE}/output"

      - name: Build offline bootc-generic-iso
        run: |
          set -euo pipefail
          sudo podman run --rm \
            --privileged \
            --security-opt label=type:unconfined_t \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            --volume "${GITHUB_WORKSPACE}/output:/output" \
            "${IMAGE_BUILDER_IMAGE}" build \
            --bootc-ref "${INSTALLER_IMAGE}" \
            --bootc-default-fs ext4 \
            --bootc-installer-payload-ref "${PAYLOAD_IMAGE}" \
            --output-dir /output \
            --output-name "${ISO_BASENAME}" \
            bootc-generic-iso

      - name: Verify ISO and generate checksum
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/output"
          if [[ ! -f "${ISO_BASENAME}.iso" ]]; then
            echo "ERROR: Expected ISO output/${ISO_BASENAME}.iso was not produced." >&2
            exit 1
          fi
          sha256sum "${ISO_BASENAME}.iso" > "${ISO_BASENAME}.iso.sha256"

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ISO_BASENAME }}
          path: |
            output/${{ env.ISO_BASENAME }}.iso
            output/${{ env.ISO_BASENAME }}.iso.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
